<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL跳转工具</title>
    <!-- 引入Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    
    <!-- 配置Tailwind自定义颜色和字体 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#10B981',
                        neutral: '#1F2937',
                    },
                    fontFamily: {
                        inter: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <!-- 自定义工具类 -->
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .card-shadow {
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
            }
            .hover-lift {
                transition: transform 0.2s ease, box-shadow 0.2s ease;
            }
            .hover-lift:hover {
                transform: translateY(-2px);
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-purple-50 min-h-screen flex flex-col items-center justify-center p-4 font-inter">
    <!-- 主容器 -->
    <div class="w-full max-w-md bg-white rounded-2xl card-shadow p-8">
        <!-- 标题区域 -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary/10 text-primary mb-4">
                <i class="fa fa-external-link text-2xl"></i>
            </div>
            <h1 class="text-[clamp(1.5rem,3vw,2rem)] font-bold text-neutral mb-2">URL跳转工具</h1>
            <p class="text-slate-500">输入网址，一键快速跳转</p>
        </div>
        
        <!-- 表单区域 -->
        <form id="urlForm" class="space-y-5">
            <div>
                <label for="urlInput" class="block text-sm font-medium text-slate-700 mb-1.5">目标网址</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                        <i class="fa fa-link"></i>
                    </span>
                    <input 
                        type="url" 
                        id="urlInput" 
                        placeholder="https://example.com" 
                        class="w-full pl-12 pr-4 py-3.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all"
                        required
                    >
                </div>
                <p class="mt-1.5 text-xs text-slate-500">支持 HTTP 和 HTTPS 协议</p>
            </div>
            
            <button 
                type="submit" 
                class="w-full bg-primary hover:bg-primary/90 text-white font-medium py-3.5 px-4 rounded-xl transition-all flex items-center justify-center gap-2 hover-lift"
            >
                <span>立即跳转</span>
                <i class="fa fa-arrow-right"></i>
            </button>
        </form>
    </div>
    
    <!-- 页脚 -->
    <footer class="mt-8 text-slate-500 text-sm">
        <p>© 2025 URL跳转工具 | 安全便捷</p>
    </footer>

    <script>
        // 获取表单和输入框元素
        const form = document.getElementById('urlForm');
        const urlInput = document.getElementById('urlInput');
        
        // 表单提交事件处理
        form.addEventListener('submit', function(e) {
            e.preventDefault(); // 阻止表单默认提交行为
            
            let url = urlInput.value.trim();
            
            // 检查URL是否包含协议，如果没有则添加http://
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'http://' + url;
            }
            
            // 跳转到输入的URL
            window.location.href = url;
        });
        
        // 为输入框添加回车键提交功能
        urlInput.addEventListener('keyup', function(e) {
            if (e.key === 'Enter') {
                form.dispatchEvent(new Event('submit'));
            }
        });

        // 页面加载时自动聚焦到输入框
        window.addEventListener('load', function() {
            urlInput.focus();
        });
    </script>
</body>
</html>
